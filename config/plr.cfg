# Klipper PLR - Exact Power Loss Recovery
# install.sh substitutes the printer-specific values.

[force_move]
enable_force_move: True

[respond]
default_type: echo

[save_variables]
filename: __USER_HOME__/printer_data/config/variables.cfg

[gcode_shell_command clear_plr]
command: sh __USER_HOME__/printer_data/plr/clear_plr.sh
timeout: 5.

[gcode_shell_command PLR_SHUTDOWN]
command: __USER_HOME__/printer_data/plr/plr_shutdown.sh
timeout: 10.

[gcode_shell_command PLR_BUILD]
command: __USER_HOME__/printer_data/plr/plr_build.sh
timeout: 420.

[gcode_macro PLR_CAPTURE_POSITION]
description: Capture X Y Z E, file position and path at power loss
gcode:
    {% set p = printer.gcode_move.gcode_position %}
    {% set fp = printer.virtual_sdcard.file_position|int %}
    {% set fpath = printer.virtual_sdcard.file_path %}
    {% set printing = printer.virtual_sdcard.is_active and fpath is string and fpath|length > 0 %}

    # Klipper parses extended parameters with shlex and then ast.literal_eval,
    # so the path has to survive both layers. A bare "{fpath}" breaks the whole
    # macro on a name containing an apostrophe - and because the macro aborts
    # there, power_loss_detected is never written either.
    #   ast layer:   wrap in double quotes, escape backslash and double quote
    #   shlex layer: wrap in single quotes, escape single quote as '''
    {% set fp_lit = '"' ~ (fpath|string|replace('\', '\\')|replace('"', '\"')) ~ '"' %}
    {% set fp_arg = "'" ~ (fp_lit|replace("'", "'\''")) ~ "'" %}

    # Only record recovery data while a print is actually running. Firing on an
    # idle machine - someone flipping the mains switch - would otherwise store a
    # placeholder path and, worse, overwrite a genuine pending recovery.
    {% if printing %}
        SAVE_VARIABLE VARIABLE=plr_x VALUE={p.x}
        SAVE_VARIABLE VARIABLE=plr_y VALUE={p.y}
        SAVE_VARIABLE VARIABLE=plr_z VALUE={p.z}
        SAVE_VARIABLE VARIABLE=plr_e VALUE={p.e}
        SAVE_VARIABLE VARIABLE=plr_fpos VALUE={fp}
        SAVE_VARIABLE VARIABLE=plr_path VALUE={fp_arg}
        SAVE_VARIABLE VARIABLE=power_loss_detected VALUE=1
        M118 PLR CAPTURE OK
        M118 X={p.x} Y={p.y} Z={p.z} E={p.e}
        M118 FPOS={fp}
    {% else %}
        M118 PLR power loss while idle - nothing to recover
    {% endif %}

    # The host shutdown runs either way, so switching the printer off at the
    # wall still halts the Pi cleanly.
    # Comment out the next two lines to keep the host running after a power loss.
    M118 PLR shutting down host
    RUN_SHELL_COMMAND CMD=PLR_SHUTDOWN

[gcode_button power_loss]
pin: !__PLR_PIN__
press_gcode:
    PLR_CAPTURE_POSITION

[gcode_macro PLR_SAVE_LAYER]
description: Save current print layer for Power Loss Recovery
gcode:
    {% set z = params.Z|default(printer.gcode_move.gcode_position.z)|float %}
    SAVE_VARIABLE VARIABLE=power_resume_z VALUE={z}

[gcode_macro clear_last_file]
gcode:
    SAVE_VARIABLE VARIABLE=power_resume_z VALUE=0
    SAVE_VARIABLE VARIABLE=plr_x VALUE=0
    SAVE_VARIABLE VARIABLE=plr_y VALUE=0
    SAVE_VARIABLE VARIABLE=plr_z VALUE=0
    SAVE_VARIABLE VARIABLE=plr_e VALUE=0
    SAVE_VARIABLE VARIABLE=plr_fpos VALUE=0
    SAVE_VARIABLE VARIABLE=plr_path VALUE='""'
    SAVE_VARIABLE VARIABLE=power_loss_detected VALUE=0
    RUN_SHELL_COMMAND CMD=clear_plr
    M118 PLR data cleared

[gcode_macro G31]
description: Clear PLR data (blocked if power loss pending)
gcode:
    {% set svv = printer.save_variables.variables %}
    {% if svv.power_loss_detected|default(0)|int == 1 %}
        M118 WARNING: Power loss data exists!
        M118 Resume first, or run: PLR_FORCE_CLEAR
    {% else %}
        clear_last_file
    {% endif %}

[gcode_macro PLR_FORCE_CLEAR]
description: Clear PLR data even if power loss pending
gcode:
    clear_last_file

[gcode_macro PLR_STATUS]
description: Show saved PLR information
gcode:
    {% set svv = printer.save_variables.variables %}
    M118 ========================================
    M118 PLR STATUS
    M118 Power Loss: {svv.power_loss_detected|default(0)}
    M118 --- Capture (exact) ---
    M118 Path: {svv.plr_path|default("NONE")}
    M118 X: {svv.plr_x|default(0)} Y: {svv.plr_y|default(0)}
    M118 Z: {svv.plr_z|default(0)} E: {svv.plr_e|default(0)}
    M118 FPOS: {svv.plr_fpos|default(0)}
    M118 --- Layer checkpoint ---
    M118 Z: {svv.power_resume_z|default(0)}
    M118 ========================================

[gcode_macro PLR_RESUME]
description: Start the recovery print built after a power loss
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set fpath = svv.plr_path|default("")|string %}
    {% if fpath and fpath != "None" and fpath.startswith('/') %}
        {% set fname = fpath.split('/')[-1] %}
        # Single-quote the name so spaces survive Klipper's shlex parsing, and
        # escape any apostrophe the same way a shell would.
        {% set fn_arg = "'plr/" ~ (fname|replace("'", "'\''")) ~ "'" %}
        M118 PLR starting recovery: plr/{fname}
        SDCARD_PRINT_FILE FILENAME={fn_arg}
    {% else %}
        M118 PLR: no recovery file to start
    {% endif %}

[delayed_gcode PLR_AUTOBUILD]
initial_duration: 5
gcode:
    {% set svv = printer.save_variables.variables %}
    {% if svv.power_loss_detected|default(0)|int == 1 %}
        {% set fpath = svv.plr_path|default("")|string %}
        {% set fpos = svv.plr_fpos|default(0)|int %}
        # RUN_SHELL_COMMAND never fails on a non-zero exit code, so this macro
        # cannot announce success. The build script reports its own result.
        {% if fpath and fpath != "None" and fpath.startswith('/') and fpos > 0 %}
            M118 ==========================================
            M118 POWER LOSS DETECTED - building recovery file
            RUN_SHELL_COMMAND CMD=PLR_BUILD
        {% else %}
            M118 PLR: recovery flag set but the saved data is unusable
            M118 PLR: clearing the stale flag
            clear_last_file
        {% endif %}
    {% endif %}

[delayed_gcode PLR_POSTCLEAR]
gcode:
    clear_last_file
