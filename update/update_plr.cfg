# Moonraker Update Manager entry for Klipper PLR.
# The installer adds an equivalent entry to moonraker.conf automatically.
# This file is kept as a reference for manual installations.

[update_manager klipper-plr]
type: git_repo
path: ~/klipper-plr
origin: https://github.com/Novin3dp/klipper-plr.git
primary_branch: main
managed_services: klipper
install_script: install.sh
